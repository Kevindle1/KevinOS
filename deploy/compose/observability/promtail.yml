# Promtail — collecte les logs des conteneurs Docker et les pousse vers Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: conteneurs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Nom du conteneur (sans le « / » initial) comme label.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Ne collecter que les conteneurs du projet KevinOS.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'kevinos'
        action: keep
