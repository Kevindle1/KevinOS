# Configuration Prometheus — socle Phase 0.
# On démarre minimal : Prometheus se surveille lui-même et scrute le Core.
# Les cibles (modules) seront ajoutées au fil des phases.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: kevinos-core
    metrics_path: /metrics
    static_configs:
      - targets: ['core:8080']
