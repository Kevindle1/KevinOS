# Configuration Prometheus — socle d'observabilité (Phase 1).

global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Règles d'alerte (RAM, disque, service down) — voir alerts.yml.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: kevinos-core
    metrics_path: /metrics
    static_configs:
      - targets: ['core:8080']

  # Métriques de l'hôte (CPU, RAM, disque) via node-exporter.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Métriques par conteneur via cAdvisor.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
