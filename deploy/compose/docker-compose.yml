# KevinOS — socle Phase 0 (infrastructure).
#
# Réseaux segmentés (docs/diagrammes/reseau.md) :
#   edge          → seul réseau exposé ; y vit le reverse proxy
#   apps          → services applicatifs, joignables via le proxy uniquement
#   data          → bases de données, JAMAIS joignables depuis edge
#   observability → métriques/logs (overlay séparé)
#
# Lancement :
#   cd deploy && cp .env.example .env   # puis renseigner les secrets
#   docker compose -f compose/docker-compose.yml --env-file .env up -d
#
# Aucun port entrant n'est publié hormis ceux du proxy (ADR-0003).

name: kevinos

networks:
  edge:
    driver: bridge
  apps:
    driver: bridge
    internal: true # pas d'accès internet sortant depuis les apps par défaut
  data:
    driver: bridge
    internal: true # base de données totalement isolée

volumes:
  postgres_data:
  redis_data:
  traefik_acme:

services:
  # --- Couche Edge : reverse proxy (Traefik) ---------------------------------
  # Découverte auto des services via labels + TLS auto (ADR-0007).
  reverse-proxy:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kevinos_edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection HTTP → HTTPS (HTTPS partout, ENF-20).
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - '80:80'
      - '443:443'
    networks:
      - edge
    volumes:
      # Lecture seule. NOTE sécurité : l'accès au socket Docker est sensible ;
      # un socket-proxy sera introduit (voir docs/05-securite.md, backlog).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Couche KevinOS : Core -------------------------------------------------
  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    image: kevinos/core:0.1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KEVINOS_HOST: 0.0.0.0
      KEVINOS_PORT: '8080'
      KEVINOS_LOG_LEVEL: ${KEVINOS_LOG_LEVEL:-info}
      KEVINOS_AI_PROVIDER: ${KEVINOS_AI_PROVIDER:-local}
      KEVINOS_OLLAMA_BASE_URL: ${KEVINOS_OLLAMA_BASE_URL:-http://kai-ollama:11434}
      KEVINOS_AI_MODEL: ${KEVINOS_AI_MODEL:-qwen2.5:3b}
    networks:
      - edge # pour être routé par le proxy
      - apps # pour joindre les modules
      - data # pour joindre Postgres/Redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=kevinos_edge
      - traefik.http.routers.core.rule=Host(`core.${KEVINOS_DOMAIN:-kevinos.local}`)
      - traefik.http.routers.core.entrypoints=websecure
      - traefik.http.routers.core.tls=true
      - traefik.http.services.core.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Couche Données : PostgreSQL (avec pgvector pour le RAG) ---------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-kevinos}
    networks:
      - data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Couche Données : Redis (cache, sessions, files BullMQ) ----------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD requis}']
    networks:
      - data
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
