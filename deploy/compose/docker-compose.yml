# KevinOS — socle (Phase 0 infra + Phase 1 sécurité).
#
# Réseaux segmentés (docs/diagrammes/reseau.md) :
#   edge          → seul réseau exposé ; reverse proxy + portail d'auth
#   apps          → services applicatifs, joignables via le proxy uniquement
#   data          → bases de données, JAMAIS joignables depuis edge
#
# Secrets : injectés par FICHIER (convention *_FILE, moindre privilège) — voir
# deploy/secrets/README.md et ADR-0010. Générer les secrets AVANT `up`.
#
# Lancement :
#   cd deploy && cp .env.example .env       # renseigner le domaine
#   (générer les secrets : voir deploy/secrets/README.md)
#   docker compose -f compose/docker-compose.yml --env-file .env up -d
#
# Aucun port entrant n'est publié hormis ceux du proxy (ADR-0003).

name: kevinos

networks:
  edge:
    driver: bridge
  apps:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  traefik_acme:
  authelia_data:

# Secrets montés dans /run/secrets/<nom> uniquement dans les services qui en ont
# besoin (moindre privilège). Les fichiers source vivent hors de Git.
secrets:
  postgres_password:
    file: ../secrets/postgres_password
  redis_password:
    file: ../secrets/redis_password
  authelia_session_secret:
    file: ../secrets/authelia_session_secret
  authelia_jwt_secret:
    file: ../secrets/authelia_jwt_secret
  authelia_storage_encryption_key:
    file: ../secrets/authelia_storage_encryption_key

services:
  # --- Couche Edge : reverse proxy (Traefik) ---------------------------------
  reverse-proxy:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kevinos_edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - '80:80'
      - '443:443'
    networks:
      - edge
    volumes:
      # NOTE sécurité : accès socket Docker sensible ; un socket-proxy est prévu
      # (docs/05-securite.md, backlog).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Couche Identité : Authelia (SSO + MFA) --------------------------------
  # Offline-first : notifier fichier, base d'utilisateurs locale (ADR-0009).
  auth:
    image: authelia/authelia:4.38
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_encryption_key
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    networks:
      - edge
      - data # pour joindre Redis (sessions)
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./authelia:/config:ro
      - authelia_data:/data
    secrets:
      - authelia_session_secret
      - authelia_jwt_secret
      - authelia_storage_encryption_key
      - redis_password
    labels:
      - traefik.enable=true
      - traefik.docker.network=kevinos_edge
      - traefik.http.routers.auth.rule=Host(`auth.${KEVINOS_DOMAIN:-kevinos.local}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls=true
      - traefik.http.services.auth.loadbalancer.server.port=9091
      # Middleware ForwardAuth réutilisable par tous les modules protégés.
      - traefik.http.middlewares.authelia.forwardauth.address=http://auth:9091/api/authz/forward-auth
      - traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ['CMD', 'authelia', 'healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Couche KevinOS : Core -------------------------------------------------
  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    image: kevinos/core:0.1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KEVINOS_HOST: 0.0.0.0
      KEVINOS_PORT: '8080'
      KEVINOS_LOG_LEVEL: ${KEVINOS_LOG_LEVEL:-info}
      KEVINOS_AI_PROVIDER: ${KEVINOS_AI_PROVIDER:-local}
      KEVINOS_OLLAMA_BASE_URL: ${KEVINOS_OLLAMA_BASE_URL:-http://kai-ollama:11434}
      KEVINOS_AI_MODEL: ${KEVINOS_AI_MODEL:-qwen2.5:3b}
    networks:
      - edge
      - apps
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=kevinos_edge
      - traefik.http.routers.core.rule=Host(`core.${KEVINOS_DOMAIN:-kevinos.local}`)
      - traefik.http.routers.core.entrypoints=websecure
      - traefik.http.routers.core.tls=true
      # Le Core public est protégé par le SSO/MFA (le scrape interne du monitoring
      # passe par le réseau `apps`, pas par le proxy — il n'est donc pas impacté).
      - traefik.http.routers.core.middlewares=authelia@docker
      - traefik.http.services.core.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Couche Données : PostgreSQL (avec pgvector pour le RAG) ---------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kevinos}
      POSTGRES_DB: ${POSTGRES_DB:-kevinos}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Couche Données : Redis (cache, sessions, files BullMQ) ----------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Mot de passe lu depuis le fichier secret (jamais en clair dans l'env).
    command: ['sh', '-c', 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"']
    networks:
      - data
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
